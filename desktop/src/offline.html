<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>WorldOS</title>
<style>
  :root { color-scheme: light dark; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: Canvas; color: CanvasText;
  }
  main { max-width: 420px; padding: 24px; text-align: center; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { margin: 0 0 20px; opacity: .75; }
  button {
    font: inherit; padding: 8px 20px; border-radius: 8px; border: 0; cursor: pointer;
    background: #5865f2; color: #fff;
  }
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <p id="body"></p>
  <button id="retry" type="button"></button>
</main>
<script>
  // Shown when worldos.cc can't be reached. Copy keyed by locale; English fallback.
  const COPY = {
    en: { title: "Can't reach WorldOS", body: "Check your internet connection, then try again.", retry: "Try again" },
    zh: { title: "无法连接 WorldOS", body: "请检查网络连接后重试。", retry: "重试" },
    es: { title: "No se puede conectar con WorldOS", body: "Revisa tu conexión a internet e inténtalo de nuevo.", retry: "Reintentar" },
  };
  const lang = (navigator.language || "en").slice(0, 2).toLowerCase();
  const copy = COPY[lang] || COPY.en;
  document.getElementById("title").textContent = copy.title;
  document.getElementById("body").textContent = copy.body;
  const retryButton = document.getElementById("retry");
  retryButton.textContent = copy.retry;
  // The main process only lets this page navigate back to the app origin.
  const target = new URLSearchParams(location.search).get("retry");
  const retry = () => { if (target) location.href = target; };
  retryButton.addEventListener("click", retry);
  window.addEventListener("online", retry);
</script>
</body>
</html>
