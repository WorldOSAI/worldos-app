apply plugin: 'com.android.application'

def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}
def releaseSigningConfigured = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword']
    .every { key -> keystoreProperties[key]?.trim() }

android {
    namespace = "cc.worldos.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "cc.worldos.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 7
        versionName "1.3"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (releaseSigningConfigured) {
            release {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // AdMob mediation: Unity Ads bidding (Game ID / placement are configured in the AdMob
    // console, not here). The adapter does NOT pull the Unity Ads SDK itself — both lines
    // are required, and their versions move together (adapter 4.21.0.x ↔ SDK 4.21.0).
    // Requires play-services-ads 25.5.0+, which Gradle resolves over the AdMob plugin's 25.4.+.
    implementation "com.unity3d.ads:unity-ads:4.21.0"
    implementation "com.google.ads.mediation:unity:4.21.0.0"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

// Build 6 is the first release that the Web bridge may register directly with FCM.
// Debug builds still work from a clean clone without private service/signing files.
def verifyReleaseConfiguration = tasks.register('verifyReleaseConfiguration') {
    doLast {
        if (!releaseSigningConfigured) {
            throw new GradleException('Release requires android/keystore.properties')
        }
        def servicesFile = file('google-services.json')
        if (!servicesFile.exists()) {
            throw new GradleException('Release requires android/app/google-services.json for FCM')
        }
        def services = new groovy.json.JsonSlurper().parse(servicesFile)
        if (services.project_info?.project_id != 'worldos-3fb07' ||
            !services.client?.any { it.client_info?.android_client_info?.package_name == 'cc.worldos.app' }) {
            throw new GradleException('Release Firebase project/package must be worldos-3fb07 / cc.worldos.app')
        }
        def capacitorFile = file('src/main/assets/capacitor.config.json')
        if (!capacitorFile.exists() ||
            new groovy.json.JsonSlurper().parse(capacitorFile).server?.url != 'https://worldos.cc') {
            throw new GradleException('Run release Capacitor sync: server URL must be exactly https://worldos.cc')
        }
    }
}
tasks.matching { it.name == 'preReleaseBuild' }.configureEach {
    dependsOn verifyReleaseConfiguration
}
