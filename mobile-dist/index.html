<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>WorldOS</title>
    <style>
      :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { align-items: center; background: Canvas; color: CanvasText; display: flex; justify-content: center; margin: 0; min-height: 100vh; }
      main { max-width: 28rem; padding: 2rem; text-align: center; }
      button { border: 0; border-radius: .75rem; font: inherit; font-weight: 650; padding: .8rem 1.2rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>WorldOS</h1>
      <p>The app could not reach the WorldOS service.</p>
      <p><button id="retry" type="button">Try again</button></p>
    </main>
    <script>
      document.getElementById("retry").addEventListener("click", () => {
        const configuredUrl = window.Capacitor?.getServerUrl?.() || "https://worldos.cc";
        const url = new URL(configuredUrl);
        url.searchParams.set("native-retry", Date.now().toString());
        location.replace(url.toString());
      });
    </script>
  </body>
</html>
