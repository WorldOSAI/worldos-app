<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>WorldOS is offline</title>
    <style>
      :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { align-items: center; background: Canvas; color: CanvasText; display: flex; justify-content: center; margin: 0; min-height: 100vh; }
      main { max-width: 28rem; padding: 2rem; text-align: center; }
      button { border: 0; border-radius: .75rem; font: inherit; font-weight: 650; padding: .8rem 1.2rem; }
      button:disabled { opacity: .6; }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>Reconnect to the internet to continue your Simulation.</p>
      <button id="retry" type="button">Try again</button>
    </main>
    <script>
      const retry = document.getElementById("retry");
      let checking = false;

      function retryTarget() {
        const configuredUrl = window.Capacitor?.getServerUrl?.() || "https://worldos.cc";
        const url = new URL(configuredUrl);
        url.searchParams.set("native-retry", Date.now().toString());
        return url.toString();
      }

      async function reconnect() {
        if (checking) return;
        checking = true;
        retry.disabled = true;
        retry.textContent = "Checking…";

        try {
          // no-cors is intentional: a successful opaque response proves that
          // the remote origin is reachable without depending on page CORS.
          await fetch(retryTarget(), { cache: "no-store", mode: "no-cors" });
          location.replace(retryTarget());
        } catch (_) {
          checking = false;
          retry.disabled = false;
          retry.textContent = "Try again";
        }
      }

      retry.addEventListener("click", reconnect);
      window.addEventListener("online", reconnect);
      setInterval(reconnect, 5000);
    </script>
  </body>
</html>
